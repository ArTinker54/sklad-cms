# Веб-корень — public. Код, настройки и загрузки лежат выше и снаружи
# недоступны в принципе, а не по правилу, которое можно потерять.

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    # TLS обрывается на прокси, до контейнера запрос доходит по http.
    # Без этого приложение считает соединение незащищённым и строит
    # ссылки с http://.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
