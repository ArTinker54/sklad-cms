; Настройки под каталог с фотографиями.

memory_limit = 256M
max_execution_time = 120

; Менеджер загружает снимки прямо с телефона — там бывает и 8 мегабайт.
; Система их пережимает, но принять исходник сначала надо.
upload_max_filesize = 16M
post_max_size = 24M
max_file_uploads = 30

date.timezone = Europe/Moscow

; Ошибки — в журнал, но не в ответ. Админка разговаривает с сервером
; через JSON, и предупреждение PHP, напечатанное рядом с ответом,
; ломает его разбор: список молча показывает «нет данных» вместо самой
; ошибки. На чужой админке это стоило мне вечера.
display_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Идентификатор сессии не должен приниматься из адреса: иначе ссылку с
; чужим идентификатором можно подсунуть администратору.
session.use_strict_mode = 1
session.use_only_cookies = 1
