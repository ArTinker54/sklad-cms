version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MYSQLHOST=mysql
      - MYSQLPORT=3306
      - MYSQLDATABASE=sklad
      - MYSQLUSER=sklad_user
      - MYSQLPASSWORD=sklad_secret_pass
      - SITE_URL=http://localhost:8080
      - SITE_STAGE=dev
      - APP_DEBUG=true
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin12345678
      - ADMIN_NAME=Администратор
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./public/upload:/var/www/html/public/upload
      - ./storage:/var/www/html/storage
      - ./config:/var/www/html/config

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=sklad
      - MYSQL_USER=sklad_user
      - MYSQL_PASSWORD=sklad_secret_pass
      - MYSQL_ROOT_PASSWORD=root_secret_pass
    ports:
      - "33066:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sklad_user", "-psklad_secret_pass"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db_data:
